# Retrov2 theme — ClassicPlatinumStreamlined / Mac OS 9 aesthetic for Hyprland

$active_border = rgba(d8d8d8ff)
$inactive_border = rgba(9b9b9bff)

general {
    border_size = 1

    col.active_border = $active_border
    col.inactive_border = $inactive_border
    no_border_on_floating = false
}

decoration {
    rounding = 0

    blur {
        enabled = false
    }

    shadow {
        enabled = true
        range = 2
        render_power = 5
        color = rgba(000000d9)
        ignore_window = true
        offset = 2 2
    }

    dim_inactive = false
    dim_strength = 0

    active_opacity = 1.0
    inactive_opacity = 1.0
}

animations {
    enabled = false
}
