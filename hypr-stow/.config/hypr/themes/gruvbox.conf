# Gruvbox — warm, earthy, solid
# Yellow→orange gradient border on the focused window, near-opaque windows, soft warm shadow

$bg       = rgb(282828)
$bg_hard  = rgb(1d2021)
$bg1      = rgb(3c3836)
$bg2      = rgb(504945)
$gray     = rgb(928374)
$fg       = rgb(ebdbb2)
$red      = rgb(cc241d)
$green    = rgb(98971a)
$yellow   = rgb(d79921)
$blue     = rgb(458588)
$purple   = rgb(b16286)
$aqua     = rgb(689d6a)
$orange   = rgb(d65d0e)
$yellow_b = rgb(fabd2f)
$orange_b = rgb(fe8019)

general {
    border_size = 2
    gaps_in = 5
    gaps_out = 10

    col.active_border = $yellow_b $orange_b 45deg
    col.inactive_border = $bg2
    no_border_on_floating = false
}

group {
    col.border_active = $aqua $green 45deg
    col.border_inactive = $bg2
    groupbar {
        col.active = $yellow
        col.inactive = $bg1
        text_color = $bg
    }
}

decoration {
    rounding = 6

    blur {
        enabled = true
        size = 4
        passes = 2
        popups = true
        special = true
        new_optimizations = true
        ignore_opacity = true
    }

    shadow {
        enabled = true
        range = 14
        render_power = 3
        color = rgba(1d2021cc)
        color_inactive = rgba(1d202188)
    }

    dim_inactive = true
    dim_strength = 0.06

    active_opacity = 0.98
    inactive_opacity = 0.93
}

# Animations
animations {
    enabled = true

    bezier = drag, 0.2, 1, 0.2, 1
    bezier = pop, 0.1, 0.8, 0.2, 1
    bezier = liner, 1, 1, 1, 1

    animation = fade, 1, 5, drag

    animation = windowsIn, 1, 6, drag, slide
    animation = windowsOut, 1, 10, pop, popin 75%
    animation = windowsMove, 1, 6, drag, slide
    animation = fadeIn, 1, 5, drag
    animation = fadeOut, 1, 5, drag
    animation = fadeSwitch, 1, 12, drag

    animation = layersIn, 1, 7, drag, slide
    animation = layersOut, 1, 20, drag
    animation = fadeLayersIn, 1, 5, drag
    animation = fadeLayersOut, 1, 10, drag

    animation = border, 1, 4, liner
    animation = borderangle, 1, 60, liner, loop

    animation = workspacesIn, 1, 7, drag, slidefade 40%
    animation = workspacesOut, 1, 7, drag, slidefade 40%

    animation = specialWorkspaceIn, 1, 6, drag, slidefadevert 80%
    animation = specialWorkspaceOut, 1, 6, drag, slidefadevert 65%
}
