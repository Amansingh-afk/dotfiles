# Catppuccin Mocha — Glass Minimalism
# No borders, heavy blur, transparency

$rosewater = rgb(f5e0dc)
$flamingo = rgb(f2cdcd)
$pink = rgb(f5c2e7)
$mauve = rgb(cba6f7)
$red = rgb(f38ba8)
$maroon = rgb(eba0ac)
$peach = rgb(fab387)
$yellow = rgb(f9e2af)
$green = rgb(a6e3a1)
$teal = rgb(94e2d5)
$sky = rgb(89dceb)
$sapphire = rgb(74c7ec)
$blue = rgb(89b4fa)
$lavender = rgb(b4befe)
$text = rgb(cdd6f4)
$subtext1 = rgb(bac2de)
$subtext0 = rgb(a6adc8)
$overlay2 = rgb(9399b2)
$overlay1 = rgb(7f849c)
$overlay0 = rgb(6c7086)
$surface2 = rgb(585b70)
$surface1 = rgb(45475a)
$surface0 = rgb(313244)
$base = rgb(1e1e2e)
$mantle = rgb(181825)
$crust = rgb(11111b)

general {
    border_size = 0
    no_border_on_floating = true
    gaps_in = 4
    gaps_out = 8
}

decoration {
    rounding = 12

    blur {
        enabled = true
        size = 8
        passes = 4
        popups = true
        special = true
        new_optimizations = true
        ignore_opacity = true
        xray = false
        brightness = 1.0
        contrast = 1.0
        noise = 0.02
        vibrancy = 0.2
    }

    shadow {
        enabled = false
    }

    dim_inactive = true
    dim_strength = 0.08

    active_opacity = 0.85
    inactive_opacity = 0.70
    fullscreen_opacity = 0.95
}

animations {
    enabled = true

    bezier = glass, 0.05, 0.9, 0.1, 1.0
    bezier = glassOut, 0.36, 0, 0.66, -0.56
    bezier = liner, 1, 1, 1, 1
    bezier = smooth, 0.25, 1, 0.5, 1

    animation = windowsIn, 1, 5, glass, popin 80%
    animation = windowsOut, 1, 4, glassOut, popin 70%
    animation = windowsMove, 1, 4, smooth, slide

    animation = fade, 1, 4, glass
    animation = fadeIn, 1, 4, glass
    animation = fadeOut, 1, 3, glass
    animation = fadeSwitch, 1, 6, glass

    animation = layersIn, 1, 4, glass, fade
    animation = layersOut, 1, 4, glass, fade
    animation = fadeLayersIn, 1, 4, glass
    animation = fadeLayersOut, 1, 4, glass

    animation = border, 1, 1, liner
    animation = borderangle, 1, 30, liner, loop

    animation = workspacesIn, 1, 5, glass, fade
    animation = workspacesOut, 1, 5, glass, fade

    animation = specialWorkspaceIn, 1, 5, glass, slidefadevert 80%
    animation = specialWorkspaceOut, 1, 5, glass, slidefadevert 65%
}
