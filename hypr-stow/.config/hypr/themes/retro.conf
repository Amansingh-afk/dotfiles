# Retro — BSOD / DOS blue screen aesthetic
# No rounding, no blur, no transparency, sharp edges, instant transitions

general {
    border_size = 2
    col.active_border = rgba(FFFFFFff)
    col.inactive_border = rgba(555555ff)
    no_border_on_floating = false
    gaps_in = 0
    gaps_out = 0
}

decoration {
    rounding = 0

    blur {
        enabled = false
    }

    shadow {
        enabled = false
    }

    dim_inactive = false
    active_opacity = 1.0
    inactive_opacity = 1.0
    fullscreen_opacity = 1.0
}

animations {
    enabled = true

    bezier = instant, 0, 0, 1, 1

    animation = windowsIn, 1, 1, instant
    animation = windowsOut, 1, 1, instant
    animation = windowsMove, 1, 1, instant

    animation = fade, 1, 1, instant
    animation = fadeIn, 1, 1, instant
    animation = fadeOut, 1, 1, instant
    animation = fadeSwitch, 1, 1, instant

    animation = layersIn, 1, 1, instant
    animation = layersOut, 1, 1, instant
    animation = fadeLayersIn, 1, 1, instant
    animation = fadeLayersOut, 1, 1, instant

    animation = border, 0
    animation = borderangle, 0

    animation = workspacesIn, 1, 1, instant
    animation = workspacesOut, 1, 1, instant

    animation = specialWorkspaceIn, 1, 1, instant
    animation = specialWorkspaceOut, 1, 1, instant
}
