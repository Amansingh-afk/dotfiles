# Main modifier key
$mainMod = SUPER

# Programs
$terminal = kitty
$fileManager = kitty yazi
$menu = ~/.config/waybar/scripts/app-launcher.sh
$scripts = ~/.config/waybar/scripts


# Application shortcuts
bind = $mainMod, Return, exec, $terminal   # Terminal
bind = $mainMod, Q, killactive,
bind = $mainMod, M, exit,
bind = $mainMod, E, exec, $fileManager    # File manager (yazi)
bind = $mainMod, V, togglefloating,
bind = $mainMod, SPACE, exec, $menu        # App launcher
bind = $mainMod, P, pseudo,
bind = $mainMod, T, togglesplit,
bind = $mainMod, F, fullscreen, 0
bind = $mainMod SHIFT, F, fullscreen, 1

# Developer shortcuts
bind = $mainMod, C, exec, kitty nvim                         # Neovim
bind = $mainMod SHIFT, Return, exec, kitty --class tui-float # Floating terminal
bind = $mainMod, B, exec, flatpak run app.zen_browser.zen    # Browser
bind = $mainMod SHIFT, T, exec, $scripts/appearance-switcher.sh          # Theme switcher
bind = $mainMod SHIFT, B, exec, $scripts/appearance-switcher.sh layouts  # Bar layout switcher
bind = $mainMod SHIFT, W, exec, $scripts/appearance-switcher.sh walls    # Wallpaper switcher
bind = $mainMod ALT, L, exec, hyprlock                       # Lock screen

# Scratchpads (pyprland, toggle = show/hide, keeps running)
bind = $mainMod, grave, exec, pypr toggle term       # Dropdown terminal
bind = $mainMod, A, exec, pypr toggle mixer          # Audio mixer (wiremix)
bind = $mainMod, N, exec, pypr toggle net            # Network (nmtui)
bind = $mainMod SHIFT, N, exec, pypr toggle bt       # Bluetooth (bluetuith)
bind = $mainMod, I, exec, pypr toggle btop           # System monitor (btop)

# Helpers
bind = $mainMod, slash, exec, $scripts/keybinds-menu.sh        # This keybind list (rofi)
bind = $mainMod SHIFT, slash, exec, $scripts/cheats-menu.sh    # Cheat sheets (rofi)
bind = $mainMod SHIFT, V, exec, $scripts/clipboard-menu.sh     # Clipboard history
bind = $mainMod, period, exec, rofimoji --action copy          # Emoji picker

# Move focus with mainMod + arrow keys
bind = $mainMod, left, movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up, movefocus, u
bind = $mainMod, down, movefocus, d

# Move focus with mainMod + vim keys
bind = $mainMod, h, movefocus, l
bind = $mainMod, l, movefocus, r
bind = $mainMod, k, movefocus, u
bind = $mainMod, j, movefocus, d

# Move windows with mainMod + SHIFT + arrow keys
bind = $mainMod SHIFT, left, movewindow, l
bind = $mainMod SHIFT, right, movewindow, r
bind = $mainMod SHIFT, up, movewindow, u
bind = $mainMod SHIFT, down, movewindow, d

# Move windows with mainMod + SHIFT + vim keys
bind = $mainMod SHIFT, h, movewindow, l
bind = $mainMod SHIFT, l, movewindow, r
bind = $mainMod SHIFT, k, movewindow, u
bind = $mainMod SHIFT, j, movewindow, d

# Switch workspaces with mainMod + [0-9]
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10

# Move active window to a workspace with mainMod + SHIFT + [0-9]
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10

# Scroll through existing workspaces with mainMod + scroll
bind = $mainMod, mouse_down, workspace, e+1
bind = $mainMod, mouse_up, workspace, e-1

# Move/resize windows with mainMod + LMB/RMB and dragging
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

# Resize windows
bind = $mainMod CTRL, left, resizeactive, -20 0
bind = $mainMod CTRL, right, resizeactive, 20 0
bind = $mainMod CTRL, up, resizeactive, 0 -20
bind = $mainMod CTRL, down, resizeactive, 0 20

# Resize windows with vim keys
bind = $mainMod CTRL, h, resizeactive, -20 0
bind = $mainMod CTRL, l, resizeactive, 20 0
bind = $mainMod CTRL, k, resizeactive, 0 -20
bind = $mainMod CTRL, j, resizeactive, 0 20

# Media and function keys
bindel = , XF86AudioRaiseVolume, exec, wpctl set-volume -l 1.0 @DEFAULT_AUDIO_SINK@ 5%+
bindel = , XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bind = , XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bind = , XF86AudioMicMute, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
bind = , XF86AudioPlay, exec, playerctl play-pause
bind = , XF86AudioPause, exec, playerctl play-pause
bind = , XF86AudioNext, exec, playerctl next
bind = , XF86AudioPrev, exec, playerctl previous
bind = , XF86MonBrightnessUp, exec, brightnessctl set +5%
bind = , XF86MonBrightnessDown, exec, brightnessctl set 5%-

# Screenshots (saved + copied to clipboard)
bind = , Print, exec, grim ~/Pictures/Screenshots/screenshot-$(date +%Y%m%d_%H%M%S).png && grim - | wl-copy
bind = $mainMod, Print, exec, grim -g "$(slurp)" - | tee ~/Pictures/Screenshots/screenshot-$(date +%Y%m%d_%H%M%S).png | wl-copy

# Special workspace
bind = $mainMod, S, togglespecialworkspace, magic
bind = $mainMod SHIFT, S, movetoworkspace, special:magic 