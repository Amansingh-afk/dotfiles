# Keybinds. One meaning per modifier:
#   Super+key         launch / toggle an app
#   Super+Shift+key   same app, alternate form
#   Super+window keys window verbs (Q F V X O G Tab hjkl)
#   Super+numbers/[]  workspaces
#   Super+Alt+key     system and appearance, rare
#   Super+/           this list, searchable (Super+Shift+/ cheat sheets)
# Trailing "# comment" on a bind is its description in Super+/ and `cheat hypr`.

$mainMod = SUPER
$terminal = kitty
$fileManager = kitty yazi
$browser = flatpak run app.zen_browser.zen
$menu = ~/.config/waybar/scripts/app-launcher.sh
$scripts = ~/.config/waybar/scripts

# ── Apps: Super + key ──────────────────────────────────────────────
bind = $mainMod, Return, exec, $terminal                 # Terminal
bind = $mainMod, grave, exec, pypr toggle term           # Dropdown terminal (toggle)
bind = $mainMod, Space, exec, $menu                      # App launcher
bind = $mainMod, E, exec, $fileManager                   # Files (yazi)
bind = $mainMod, C, exec, kitty nvim                     # Code (neovim)
bind = $mainMod, B, exec, $browser                       # Browser
bind = $mainMod, A, exec, pypr toggle mixer              # Audio mixer (wiremix)
bind = $mainMod, N, exec, pypr toggle net                # Network (nmtui)
bind = $mainMod, I, exec, pypr toggle btop               # System info (btop)
bind = $mainMod, period, exec, rofimoji --action copy    # Emoji picker

# ── Same app, alternate form: Super + Shift + key ─────────────────
bind = $mainMod SHIFT, Return, exec, kitty --class tui-float        # Floating terminal
bind = $mainMod SHIFT, E, exec, kitty --class tui-float yazi        # Floating files
bind = $mainMod SHIFT, B, exec, $browser --private-window           # Private browser window
bind = $mainMod SHIFT, N, exec, pypr toggle bt                      # Bluetooth (bluetuith)

# ── Windows ───────────────────────────────────────────────────────
bind = $mainMod, Q, killactive,                          # Close window
bind = $mainMod, F, fullscreen, 0                        # Fullscreen
bind = $mainMod SHIFT, F, fullscreen, 1                  # Maximize (keeps bar and gaps)
bind = $mainMod, V, togglefloating,                      # Toggle floating
bind = $mainMod, X, centerwindow,                        # Center floating window
bind = $mainMod, O, pin,                                 # Pin floating window on all workspaces
bind = $mainMod, G, togglegroup,                         # Group windows into tabs
bind = $mainMod SHIFT, G, moveoutofgroup,                # Leave group
bind = $mainMod CTRL, Tab, changegroupactive, f          # Next tab in group
bind = $mainMod, Tab, cyclenext,                         # Next window
bind = $mainMod SHIFT, Tab, cyclenext, prev              # Previous window
bind = $mainMod, S, togglespecialworkspace, magic        # Stash workspace (toggle)
bind = $mainMod SHIFT, S, movetoworkspace, special:magic # Move window to stash

# focus
bind = $mainMod, h, movefocus, l                         # Focus left
bind = $mainMod, j, movefocus, d                         # Focus down
bind = $mainMod, k, movefocus, u                         # Focus up
bind = $mainMod, l, movefocus, r                         # Focus right
bind = $mainMod, left, movefocus, l
bind = $mainMod, down, movefocus, d
bind = $mainMod, up, movefocus, u
bind = $mainMod, right, movefocus, r

# move
bind = $mainMod SHIFT, h, movewindow, l                  # Move window left
bind = $mainMod SHIFT, j, movewindow, d                  # Move window down
bind = $mainMod SHIFT, k, movewindow, u                  # Move window up
bind = $mainMod SHIFT, l, movewindow, r                  # Move window right
bind = $mainMod SHIFT, left, movewindow, l
bind = $mainMod SHIFT, down, movewindow, d
bind = $mainMod SHIFT, up, movewindow, u
bind = $mainMod SHIFT, right, movewindow, r

# resize
bind = $mainMod CTRL, h, resizeactive, -40 0             # Resize narrower
bind = $mainMod CTRL, j, resizeactive, 0 40              # Resize taller
bind = $mainMod CTRL, k, resizeactive, 0 -40             # Resize shorter
bind = $mainMod CTRL, l, resizeactive, 40 0              # Resize wider
bind = $mainMod CTRL, left, resizeactive, -40 0
bind = $mainMod CTRL, down, resizeactive, 0 40
bind = $mainMod CTRL, up, resizeactive, 0 -40
bind = $mainMod CTRL, right, resizeactive, 40 0

# mouse
bindm = $mainMod, mouse:272, movewindow                  # Drag window
bindm = $mainMod, mouse:273, resizewindow                # Drag resize

# ── Workspaces ────────────────────────────────────────────────────
bind = $mainMod, 1, workspace, 1                         # Workspace 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10
bind = $mainMod SHIFT, 1, movetoworkspace, 1             # Move window to workspace 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10
bind = $mainMod, bracketleft, workspace, e-1             # Previous workspace
bind = $mainMod, bracketright, workspace, e+1            # Next workspace
bind = $mainMod SHIFT, bracketleft, movetoworkspace, e-1 # Move window to previous workspace
bind = $mainMod SHIFT, bracketright, movetoworkspace, e+1 # Move window to next workspace
bind = $mainMod, Escape, workspace, previous             # Last used workspace
bind = $mainMod, mouse_down, workspace, e+1
bind = $mainMod, mouse_up, workspace, e-1

# ── System and appearance: Super + Alt + key ──────────────────────
bind = $mainMod ALT, L, exec, hyprlock                                        # Lock screen
bind = $mainMod ALT, M, exec, $scripts/power-menu.sh                         # Power menu (logout, sleep, reboot, off)
bind = $mainMod ALT, R, exec, hyprctl reload && notify-send "Hyprland" "config reloaded"  # Reload Hyprland config
bind = $mainMod ALT, T, exec, $scripts/appearance-switcher.sh                # Theme switcher
bind = $mainMod ALT, B, exec, $scripts/appearance-switcher.sh layouts        # Bar layout switcher
bind = $mainMod ALT, W, exec, $scripts/appearance-switcher.sh walls          # Wallpaper switcher
bind = $mainMod ALT, V, exec, $scripts/clipboard-menu.sh                     # Clipboard history
bind = $mainMod ALT, D, exec, makoctl dismiss --all                          # Dismiss notifications
bind = $mainMod ALT, S, togglesplit,                                         # Toggle split direction
bind = $mainMod ALT, C, exec, hyprpicker -a -f hex                          # Colour picker (hex to clipboard)
bind = $mainMod ALT, Print, exec, $scripts/screenrecord.sh region              # Screen record region (toggle)
bind = $mainMod ALT SHIFT, Print, exec, $scripts/screenrecord.sh full          # Screen record full screen (toggle)

# ── Help ──────────────────────────────────────────────────────────
bind = $mainMod, slash, exec, $scripts/keybinds-menu.sh          # Keybind list (searchable, Enter runs)
bind = $mainMod SHIFT, slash, exec, $scripts/cheats-menu.sh      # Cheat sheets

# ── Media keys (l = also on lock screen, e = repeat) ──────────────
bindel = , XF86AudioRaiseVolume, exec, wpctl set-volume -l 1.0 @DEFAULT_AUDIO_SINK@ 5%+   # Volume up
bindel = , XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-          # Volume down
bindl = , XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle                 # Mute
bindl = , XF86AudioMicMute, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle            # Mute mic
bindl = , XF86AudioPlay, exec, playerctl play-pause                                       # Play / pause
bindl = , XF86AudioPause, exec, playerctl play-pause
bindl = , XF86AudioNext, exec, playerctl next                                             # Next track
bindl = , XF86AudioPrev, exec, playerctl previous                                         # Previous track
bindel = , XF86MonBrightnessUp, exec, brightnessctl set +5%                               # Brightness up
bindel = , XF86MonBrightnessDown, exec, brightnessctl set 5%-                             # Brightness down

# ── Screenshots (saved to ~/Pictures/Screenshots + clipboard) ─────
bind = , Print, exec, $scripts/screenshot.sh region              # Screenshot region
bind = SHIFT, Print, exec, $scripts/screenshot.sh full           # Screenshot full screen
bind = CTRL, Print, exec, $scripts/screenshot.sh window          # Screenshot active window
