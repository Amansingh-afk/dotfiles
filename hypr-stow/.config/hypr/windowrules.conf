# Productive window rules
windowrule = opacity 0.95 0.95,class:^(firefox)$
windowrule = opacity 0.98 0.95,class:^(kitty)$
windowrule = opacity 0.95 0.95,class:^(neovim)$
windowrule = opacity 0.95 0.95,class:^(cursor)$

# Focus rules
windowrule = immediate, class:^(kitty)$                          # No animations for terminal
windowrule = immediate, class:^(cursor)$                         # No animations for Cursor

# Floating rules for pop-ups and utilities
windowrule = float, class:^(lxpolkit)$
windowrule = center, class:^(lxpolkit)$
windowrule = float, title:^(Media viewer)$
windowrule = float, title:^(Picture-in-Picture)$
windowrule = float, title:^(DevTools)$

# Size rules for floating windows
windowrule = size 900 600, title:^(DevTools)$

# Position rules
windowrule = center, title:^(DevTools)$

# Window rules for development
windowrule = float, class:^(firefox)$,title:^(Picture-in-Picture)$
windowrule = pin, class:^(firefox)$,title:^(Picture-in-Picture)$
windowrule = float, title:^(btop)$
windowrule = float, title:^(update-sys)$

# Floating TUI windows (kitty --class tui-float): file chooser, cheat sheets, floating shell
windowrule = float, class:^(tui-float)$
windowrule = size 1000 650, class:^(tui-float)$
windowrule = center, class:^(tui-float)$
