# Productive window rules
windowrule = opacity 0.95 0.95,class:^(firefox)$
windowrule = opacity 0.98 0.95,class:^(Alacritty)$
windowrule = opacity 0.95 0.95,class:^(neovim)$
windowrule = opacity 0.95 0.95,class:^(cursor)$

# Focus rules
windowrule = immediate, class:^(Alacritty)$                      # No animations for terminal
windowrule = immediate, class:^(cursor)$                         # No animations for Cursor

# Floating rules for pop-ups and utilities
windowrule = float, class:^(lxpolkit)$
windowrule = center, class:^(lxpolkit)$
windowrule = float, class:^(pavucontrol)$
windowrule = float, title:^(Media viewer)$
windowrule = float, title:^(Volume Control)$
windowrule = float, title:^(Picture-in-Picture)$
windowrule = float, title:^(DevTools)$

# Size rules for floating windows
windowrule = size 800 600, class:^(pavucontrol)$
windowrule = size 800 600, title:^(Volume Control)$
windowrule = size 900 600, title:^(DevTools)$

# Position rules
windowrule = center, class:^(pavucontrol)$
windowrule = center, title:^(Volume Control)$
windowrule = center, title:^(DevTools)$

# Window rules for development
windowrule = float, class:^(pavucontrol)$
windowrule = float, class:^(blueman-manager)$
windowrule = float, class:^(nm-connection-editor)$
windowrule = float, class:^(firefox)$,title:^(Picture-in-Picture)$
windowrule = pin, class:^(firefox)$,title:^(Picture-in-Picture)$
windowrule = float, title:^(btop)$
windowrule = float, title:^(update-sys)$

# GNOME Apps - Window Rules
# File manager (Nautilus)
windowrule = float, class:^(org.gnome.Nautilus)$
windowrule = size 1200 700, class:^(org.gnome.Nautilus)$
windowrule = center, class:^(org.gnome.Nautilus)$
windowrule = animation slide, class:^(org.gnome.Nautilus)$

# Calculator
windowrule = float, class:^(org.gnome.Calculator)$
windowrule = size 325 450, class:^(org.gnome.Calculator)$
windowrule = move 75% 10%, class:^(org.gnome.Calculator)$

# Calendar
windowrule = float, class:^(org.gnome.Calendar)$
windowrule = size 800 600, class:^(org.gnome.Calendar)$
windowrule = move 60% 5%, class:^(org.gnome.Calendar)$

# System Monitor
windowrule = float, class:^(org.gnome.SystemMonitor)$
windowrule = size 1000 600, class:^(org.gnome.SystemMonitor)$
windowrule = move 20% 10%, class:^(org.gnome.SystemMonitor)$

# Text Editor
windowrule = float, class:^(org.gnome.TextEditor)$
windowrule = size 900 700, class:^(org.gnome.TextEditor)$
windowrule = center, class:^(org.gnome.TextEditor)$

# Disk Usage Analyzer (Baobab)
windowrule = float, class:^(org.gnome.baobab)$
windowrule = size 950 600, class:^(org.gnome.baobab)$
windowrule = move 25% 15%, class:^(org.gnome.baobab)$

# Disk Utility
windowrule = float, class:^(org.gnome.DiskUtility)$
windowrule = size 900 600, class:^(org.gnome.DiskUtility)$
windowrule = move 30% 20%, class:^(org.gnome.DiskUtility)$

# Characters
windowrule = float, class:^(org.gnome.Characters)$
windowrule = size 700 500, class:^(org.gnome.Characters)$
windowrule = center, class:^(org.gnome.Characters)$

# Font Viewer
windowrule = float, class:^(org.gnome.font-viewer)$
windowrule = size 800 600, class:^(org.gnome.font-viewer)$
windowrule = center, class:^(org.gnome.font-viewer)$

# Settings
windowrule = float, class:^(org.gnome.Settings)$
windowrule = size 1100 700, class:^(org.gnome.Settings)$
windowrule = center, class:^(org.gnome.Settings)$

# Weather
windowrule = float, class:^(org.gnome.Weather)$
windowrule = size 900 600, class:^(org.gnome.Weather)$
windowrule = move 65% 10%, class:^(org.gnome.Weather)$

# Image Viewer (Loupe)
windowrule = float, class:^(org.gnome.Loupe)$
windowrule = size 1000 800, class:^(org.gnome.Loupe)$
windowrule = center, class:^(org.gnome.Loupe)$

# Document Viewer (Evince)
windowrule = float, class:^(org.gnome.Evince)$
windowrule = size 1100 800, class:^(org.gnome.Evince)$
windowrule = center, class:^(org.gnome.Evince)$

# Logs
windowrule = float, class:^(org.gnome.Logs)$
windowrule = size 900 600, class:^(org.gnome.Logs)$
windowrule = move 15% 15%, class:^(org.gnome.Logs)$

# Common animations for all GNOME apps
windowrule = animation slide, class:^(org.gnome.*)$ 
