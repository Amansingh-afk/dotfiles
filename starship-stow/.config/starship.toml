# Starship Prompt Config
# Gruvbox powerline — two-line, informative, screenshot-worthy

format = """
[](fg:#458588)\
$os\
[](bg:#98971a fg:#458588)\
$directory\
[](fg:#98971a bg:#d79921)\
$git_branch\
$git_status\
[](fg:#d79921 bg:#689d6a)\
$conda\
$python\
$nodejs\
$rust\
$golang\
[](fg:#689d6a)\
$fill\
$status\
$cmd_duration\
[ ]()\
[](fg:#b16286)\
$username\
[](bg:#458588 fg:#b16286)\
$time\
[](fg:#458588)\
$line_break\
$character"""

right_format = ""

add_newline = true

palette = "gruvbox"

[palettes.gruvbox]
fg = "#ebdbb2"
bg = "#282828"
red = "#cc241d"
green = "#98971a"
yellow = "#d79921"
blue = "#458588"
purple = "#b16286"
aqua = "#689d6a"
orange = "#d65d0e"

# ── Left side ─────────────────────────────────────────

[os]
disabled = false
style = "bg:#458588 fg:#ebdbb2 bold"
format = "[ $symbol ]($style)"

[os.symbols]
Fedora = ""
Linux = ""
Macos = ""
Ubuntu = ""
Arch = ""

[directory]
style = "bg:#98971a fg:#282828 bold"
format = "[  $path ]($style)"
truncation_length = 3
truncation_symbol = "…/"
read_only = " 󰌾"

[directory.substitutions]
"Documents" = "󰈙 "
"Downloads" = " "
"Pictures" = " "
"realm" = "󰊢 "
"~" = " "

[git_branch]
symbol = ""
style = "bg:#d79921 fg:#282828 bold"
format = "[ $symbol $branch ]($style)"

[git_status]
style = "bg:#d79921 fg:#282828 bold"
format = "[$all_status$ahead_behind]($style)"
ahead = " ⇡${count}"
behind = " ⇣${count}"
diverged = " ⇕⇡${ahead_count}⇣${behind_count}"
modified = " !${count}"
staged = " +${count}"
untracked = " ?${count}"
deleted = " ✘${count}"
stashed = " ≡${count}"
conflicted = " =${count}"

[conda]
symbol = " "
style = "bg:#689d6a fg:#282828 bold"
format = "[ $symbol$environment ]($style)"
ignore_base = false

[python]
symbol = " "
style = "bg:#689d6a fg:#282828 bold"
format = "[ $symbol$version( \\($virtualenv\\)) ]($style)"
detect_extensions = []

[nodejs]
symbol = " "
style = "bg:#689d6a fg:#282828 bold"
format = "[ $symbol$version ]($style)"

[rust]
symbol = " "
style = "bg:#689d6a fg:#282828 bold"
format = "[ $symbol$version ]($style)"

[golang]
symbol = " "
style = "bg:#689d6a fg:#282828 bold"
format = "[ $symbol$version ]($style)"

# ── Right side (on line 1) ────────────────────────────

[fill]
symbol = " "

[status]
disabled = false
symbol = "✘"
format = "[$symbol $status ]($style)"
style = "bold red"

[cmd_duration]
min_time = 500
format = "[ 󰔛 $duration]($style) "
style = "bold yellow"
show_milliseconds = false

[username]
show_always = true
style_user = "bg:#b16286 fg:#282828 bold"
style_root = "bg:#cc241d fg:#282828 bold"
format = "[ 󰀄 $user ]($style)"

[time]
disabled = false
time_format = "%H:%M"
style = "bg:#458588 fg:#ebdbb2 bold"
format = "[  $time ]($style)"

# ── Line 2: input ─────────────────────────────────────

[character]
success_symbol = "[❯](bold green)"
error_symbol = "[❯](bold red)"
vimcmd_symbol = "[❮](bold green)"
vimcmd_replace_one_symbol = "[❮](bold purple)"
vimcmd_replace_symbol = "[❮](bold purple)"
vimcmd_visual_symbol = "[❮](bold yellow)"
